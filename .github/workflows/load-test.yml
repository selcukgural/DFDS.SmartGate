name: Load test

# Runs the k6 scenario (tests/load/k6/visits.js) at 300 req/s against the API on a runner-local PostgreSQL.
# Manual trigger only: it is a capacity smoke test on shared hardware, not a gate for every pull request.
on:
  workflow_dispatch:
    inputs:
      p95_ms:
        description: p95 latency threshold (ms). Shared runners are slower than the target environment.
        default: "400"
      p99_ms:
        description: p99 latency threshold (ms)
        default: "1000"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONNECTION_STRING: Host=localhost;Database=visits;Username=postgres;Password=postgres

jobs:
  k6:
    name: k6 @ 300 req/s
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visits
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (Release)
        run: dotnet build DFDS.SmartGate.Api/DFDS.SmartGate.Api.csproj -c Release

      - name: Apply schema
        run: |
          dotnet tool install -g dotnet-ef
          ConnectionStrings__Visits="$CONNECTION_STRING" dotnet ef database update --project src/DFDS.SmartGate.Infrastructure --no-build -c Release

      - name: Issue a development token
        id: token
        run: |
          TOKEN=$(dotnet user-jwts create --project DFDS.SmartGate.Api --name gate-operator --claim "terminal=DKCPH SEGOT" --output token | tail -1)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Start the API
        env:
          ASPNETCORE_ENVIRONMENT: Development   # accepts the user-jwts token; everything else is identical to production
          ConnectionStrings__Visits: ${{ env.CONNECTION_STRING }}
          ASPNETCORE_URLS: http://localhost:5072
        run: |
          nohup dotnet run --project DFDS.SmartGate.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 30); do sleep 1; curl -sf http://localhost:5072/health/ready && break; done
          curl -sf http://localhost:5072/health/ready

      - uses: grafana/setup-k6-action@v1

      - name: Run k6
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          PROFILE: ci
          P95_MS: ${{ inputs.p95_ms }}
          P99_MS: ${{ inputs.p99_ms }}
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: k6-report.html
        run: k6 run --summary-export k6-summary.json tests/load/k6/visits.js

      - name: Publish key metrics to the job summary
        if: always()
        run: |
          {
            echo "## k6 load test – 300 req/s (CI profile, shared runner)"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            jq -r '
              def ms: (. * 100 | round / 100 | tostring) + " ms";
              "| Requests | \(.metrics.http_reqs.count) (\(.metrics.http_reqs.rate | . * 10 | round / 10)/s) |",
              "| Failed requests | \(.metrics.http_req_failed.value * 100 | . * 100 | round / 100)% |",
              "| Latency p50 / p95 / p99 | \(.metrics.http_req_duration.med | ms) / \(.metrics.http_req_duration["p(95)"] | ms) / \(.metrics.http_req_duration["p(99)"] | ms) |",
              "| Search p95 | \(.metrics["http_req_duration{name:search}"]["p(95)"] | ms) |",
              "| Get by id p95 | \(.metrics["http_req_duration{name:get}"]["p(95)"] | ms) |",
              "| Create p95 | \(.metrics["http_req_duration{name:create}"]["p(95)"] | ms) |",
              "| Status update p95 | \(.metrics["http_req_duration{name:status}"]["p(95)"] | ms) |",
              "| Dropped iterations | \(.metrics.dropped_iterations.count // 0) |"
            ' k6-summary.json
            echo
            echo "Pass/fail against the latency and error thresholds is the result of the *Run k6* step. Time-series charts: download the \`k6-results\` artifact and open \`k6-report.html\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results (HTML report, summary, API log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            k6-report.html
            k6-summary.json
            api.log
